name: Build iOS IPA (unsigned + TrollStore fakesigned)

# Ported from upstream's .gitlab-ci.yml `build:ios` job: same mobile bundle,
# `xcodebuild archive` without a signing identity, then two packages:
#   - openGym-<ver>-unsigned.ipa    for Sideloadly / AltStore
#   - openGym-<ver>-fakesigned.ipa  ldid -S with entitlements, for TrollStore
# TrollStore's docs: "fakesign them with ldid and the entitlements you want
# (ldid -S) and TrollStore will preserve the entitlements when resigning them
# with the fake root certificate on installation."

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ios.yml'
      - '.github/opengym-entitlements.plist'

permissions:
  contents: write

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Toolchain versions
        run: |
          set -eu
          xcodebuild -version
          node -v
          npm -v
          if ! command -v pod >/dev/null 2>&1; then
            echo "CocoaPods missing, installing..."
            brew install cocoapods || sudo gem install cocoapods --no-document
          fi
          pod --version
          if ! command -v ldid >/dev/null 2>&1; then
            echo "ldid missing, installing..."
            brew install ldid
          fi
          ldid -v || true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mobile web bundle and sync native projects
        working-directory: frontend
        run: npm run build:mobile

      - name: Archive (unsigned)
        working-directory: frontend/ios/App
        run: |
          set -eu
          VER="$(node -p "require('../../package.json').version")"
          BUILD="$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' ../../android/app/build.gradle | sed -n 1p)"
          [ -n "$BUILD" ] || { echo "could not read versionCode from android/app/build.gradle" >&2; exit 1; }
          echo "IPA_VERSION=$VER" >> "$GITHUB_ENV"
          echo "version=$VER build=$BUILD"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Package both flavours
        working-directory: frontend/ios/App
        run: |
          set -eu
          APP=build/App.xcarchive/Products/Applications/App.app
          ENT="$GITHUB_WORKSPACE/.github/opengym-entitlements.plist"
          ls -l "$APP/App"

          # --- 1) plain unsigned (.ipa = zip with the .app under Payload/) ---
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qr "$GITHUB_WORKSPACE/openGym-$IPA_VERSION-unsigned.ipa" Payload

          # --- 2) fakesign with ldid so TrollStore accepts it ---
          echo "--- before fakesign ---"
          codesign -dvvv Payload/App.app/App 2>&1 | head -5 || true
          for fw in Payload/App.app/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            name="$(basename "$fw" .framework)"
            if [ -f "$fw/$name" ]; then ldid -S"$ENT" "$fw/$name"; fi
          done
          ldid -S"$ENT" Payload/App.app/App
          echo "--- entitlements after fakesign ---"
          ldid -e Payload/App.app/App
          zip -qr "$GITHUB_WORKSPACE/openGym-$IPA_VERSION-fakesigned.ipa" Payload

          cd "$GITHUB_WORKSPACE"
          shasum -a 256 openGym-*unsigned.ipa openGym-*fakesigned.ipa | tee openGym-sha256.txt
          ls -lh openGym-*.ipa

      - name: Upload IPAs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openGym-ipa
          path: |
            openGym-*.ipa
            openGym-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish as release assets
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "ios-$IPA_VERSION-${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "openGym $IPA_VERSION - iOS IPA (build ${{ github.run_number }})" \
            --notes "Built from $(git rev-parse --short HEAD). Use *-fakesigned.ipa for TrollStore, *-unsigned.ipa for Sideloadly / AltStore." \
            openGym-*.ipa openGym-sha256.txt

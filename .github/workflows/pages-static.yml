name: Deploy openGym PWA to GitHub Pages

# A static build of the REAL app (no VITE_DEMO), so the iPhone gets the normal sign-in
# screen with "Continue without account" instead of the seeded demo data.
#
# Why this works with no backend: frontend/src/lib/guest.js decides that guest mode is
# allowed unless the server *positively* says otherwise — an unreachable /api/config is
# not `allow_guest: false`. useStore.js's refreshConfig() swallows the failure
# (`catch { return null }`), so on Pages the app boots into guest mode and keeps
# everything in localStorage. Pages is HTTPS, so the service worker registers and the
# app is a real offline-capable PWA.
#
# The exercise media (180 px stills + animations) is staged from catalogue/media next to
# the build, so the PWA serves it from its own origin.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-static.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The 180 px stills and animations from catalogue/media, served next to the app
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - name: Sanity-check the bundle
        run: |
          set -eu
          test -f frontend/dist/index.html
          test -f frontend/dist/sw.js
          test -f frontend/dist/manifest.json
          ls frontend/dist | head -20
          du -sh frontend/dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
